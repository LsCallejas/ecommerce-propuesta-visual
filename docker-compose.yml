# ==============================================================================
# DOCKER COMPOSE - ORQUESTACIÓN MULTI-CONTENEDOR DE PRODUCCIÓN
# PROYECTO: Plataforma E-Commerce Oficial & Backoffice
# RESPONSABLE / ADMINISTRADOR: Daniel Campos
# SERVICIOS:
#   1. db:  Motor de Base de Datos Relacional PostgreSQL 16 con Esquema ACID
#   2. api: Micro-Backend REST API en Node.js conectado a PostgreSQL
#   3. web: Servidor Web Nginx (HTML5/CSS3/Vanilla JS + Proxy Inverso /api/)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Servicio 1: Base de Datos Relacional (PostgreSQL 16 Oficial)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ecommerce_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: daniel_admin
      POSTGRES_PASSWORD: DanielAdmin2026Secure!
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # Persistencia de datos en disco del host
      - postgres_data:/var/lib/postgresql/data
      # Script DDL oficial que inicializa tablas, vistas, índices y datos semilla
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daniel_admin -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_network

  # ----------------------------------------------------------------------------
  # Servicio 2: Micro-Backend REST API (Node.js Express + pg)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce_api_service
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://daniel_admin:DanielAdmin2026Secure!@db:5432/ecommerce_db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend/server.js:/app/server.js:ro
    networks:
      - ecommerce_network

  # ----------------------------------------------------------------------------
  # Servicio 3: Servidor Web Frontend & Panel Administrativo (Nginx Alpine)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_web_app
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ecommerce_network

networks:
  ecommerce_network:
    name: ecommerce_network
    driver: bridge

volumes:
  postgres_data:
    name: ecommerce_postgres_data
