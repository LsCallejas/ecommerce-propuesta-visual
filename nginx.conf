# ==============================================================================
# CONFIGURACIÓN DE NGINX DE ALTO RENDIMIENTO PARA E-COMMERCE
# Proyecto: Plataforma E-Commerce Oficial Daniel Campos
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión GZIP para acelerar transferencia y tiempo de carga
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Cabeceras de Seguridad HTTP Estándar de la Industria
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ruta principal y manejo de rutas limpias
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché optimizada para recursos estáticos (CSS, JS, Imágenes)
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?|eot|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Deshabilitar caché estricto para archivos HTML para reflejar cambios inmediatos
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Manejo de errores estándar
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
